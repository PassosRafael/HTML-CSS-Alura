<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
    <title>AluraBooks</title>

</head>
<body>
    <header class="cabeçalho">
        <div class="container">  
            <input type="checkbox" id="menu" class="container__botao">
            <label for="menu"><span class="cabeçalho__menu-hamburguer container__imagem"></span>
            </label>
            <ul class="lista-menu">
                <li class="lista-menu__titulo">Categorias</li>

                <li class="lista-menu__item"> 
                    <a href="#" class="lista-menu__link">Programação</a>
                </li>

                <li class="lista-menu__item"> 
                    <a href="#" class="lista-menu__link">Front-End</a>
                </li>

                <li class="lista-menu__item"> 
                    <a href="#" class="lista-menu__link">Infraestrutura</a>
                </li>

                <li class="lista-menu__item"> 
                    <a href="#" class="lista-menu__link">Business</a>
                </li>

                <li class="lista-menu__item"> 
                    <a href="#" class="lista-menu__link">Design & UX</a>
                </li>
            </ul>
            <img src="imagens/Logo.svg" alt="Logo AluraBooks" class="container__imagem">
        </div>
        
        <div class="container">
            <a href="#"><img src="imagens/Favoritos.svg" alt="Meus Favoritos" class="container__imagem"></a>
            <a href="#"><img src="imagens/Compras.svg" alt="Carrinho de Compras" class="container__imagem"></a>
            <a href="#"><img src="imagens/Usuário.svg" alt="Meu Perfil" class="container__imagem"></a> 
        </div>
          
    </header>

    <section class="banner">
        <h2 class="banner__titulo">Já sabe por onde começar?</h2>
        <p class="banner__texto">Econtre em nossa estante o que precisa para o seu desenvolvimento!</p>
        <input type="search" class="banner__pesquisa" placeholder="Qual será sua próxima leitura?">
    </section>

    <section class="carrossel">
        <h2 class="carrossel__titulo">Novos lançamentos</h2>
         <div class="swiper">

        <div class="swiper-pagination"></div>
        <div class="swiper-wrapper">
            
            <div class="swiper-slide"><img src="imagens/ApacheKafka.svg" alt="Livro sobre apache kafka e spring boot da alura books"></div>
            <div class="swiper-slide"><img src="imagens/Liderança.svg" alt="Livro sobre liderança em design da alura books"></div>
            <div class="swiper-slide"><img src="imagens/Javascript.svg" alt="Livro sobre javascript assertivo da alura books"></div>
            <div class="swiper-slide"><img src="imagens/Guia Front-end.svg" alt="Livro guia front-end"></div>
            <div class="swiper-slide"><img src="imagens/Portugol.svg" alt="Livro sobre portugol"></div>
            <div class="swiper-slide"><img src="imagens/Acessibilidade.svg" alt="Livro sobre acessibilidade"></div>
        </div>
        
        
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

    </div>
    </section>

    <main></main>
    <footer></footer>

    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
        spaceBetween: 10,
        slidesPerView: 3,
        pagination: {
            el: '.swiper-pagination',
            type: 'bullets',
            },
        });
    </script>
</body>
</html>
